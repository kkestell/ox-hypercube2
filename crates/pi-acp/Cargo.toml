[package]
name = "pi-acp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "ACP bridge for the Pi CLI"

[dependencies]
acp-bridge = { path = "../acp-bridge" }
agent-client-protocol = { version = "=5.2.0", features = ["stdio", "unstable_protocol_v2"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
acp-bridge = { path = "../acp-bridge", features = ["testing"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }

[lints]
workspace = true
