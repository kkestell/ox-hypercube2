[package]
name = "claude-code-acp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "ACP bridge for the Claude Code CLI"

[dependencies]
acp-bridge = { path = "../acp-bridge" }
agent-client-protocol = { version = "=5.2.0", features = ["stdio", "unstable_protocol_v2"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
acp-bridge = { path = "../acp-bridge", features = ["testing"] }
tempfile = "3"

[lints]
workspace = true
