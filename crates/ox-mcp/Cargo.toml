[package]
name = "ox-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The ox MCP server oxd gives its agents"

[dependencies]
ox-protocol = { path = "../ox-protocol" }
rmcp = { version = "3.10", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

[lints]
workspace = true
